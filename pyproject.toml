[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-illustrator-workflow"
version = "0.2.0"
description = "Auditable figure workflow checks and annotation planning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
figureflow = "figureflow:main"

[project.urls]
Repository = "https://github.com/erickwang-17/prism-illustrator-workflow"

[tool.setuptools]
py-modules = ["figureflow", "figureflow_lint"]
